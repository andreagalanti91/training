<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hybrid ProGram">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Hybrid ProGram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000;--accent:#FF7A1A;--accent-soft:#FFB070;
  --text:#fff;--text-2:rgba(255,255,255,.70);--text-3:rgba(255,255,255,.46);--hair:rgba(255,255,255,.10);
  --z2:#4FD1C5;--z3:#F6C343;--z4:#FF7A1A;--z5:#FF4D4D;
  color-scheme:dark;box-sizing:border-box;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
  --bar-h:86px;
}
/* Salvata sulla schermata Home la status bar copre la pagina: garantiamo uno spazio minimo. */
@media (display-mode:standalone),(display-mode:fullscreen),(display-mode:minimal-ui){
  :root{--safe-top:max(env(safe-area-inset-top,0px),46px)}
}
html.pwa{--safe-top:max(env(safe-area-inset-top,0px),46px)}
html{height:100%;-webkit-text-size-adjust:100%;overscroll-behavior:none;background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
/* Shell a tutta altezza: l'altezza reale arriva da visualViewport, così la navbar resta ancorata in basso. */
body{margin:0;position:fixed;top:0;left:0;right:0;bottom:0;height:auto;
  display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum" 1;
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;touch-action:manipulation}
input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:12px}

.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.ambient i{position:absolute;border-radius:50%;filter:blur(70px)}
.ambient .a{width:70vmax;height:70vmax;right:-30vmax;top:-32vmax;background:radial-gradient(circle,#FF6A00 0%,#C94100 45%,transparent 70%)}
.ambient .b{width:60vmax;height:60vmax;left:-32vmax;bottom:-20vmax;background:radial-gradient(circle,#7A2400 0%,#3a1200 50%,transparent 70%)}
.ambient .c{width:34vmax;height:34vmax;left:40%;top:48%;background:radial-gradient(circle,rgba(255,140,50,.35),transparent 70%)}

/* Liquid Glass */
.glass{position:relative;isolation:isolate;
  background:linear-gradient(160deg,rgba(255,255,255,.13) 0%,rgba(255,255,255,.045) 42%,rgba(255,255,255,.07) 100%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.04),0 14px 40px rgba(0,0,0,.45)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
  background:linear-gradient(150deg,rgba(255,255,255,.6),rgba(255,255,255,.08) 30%,rgba(255,255,255,0) 55%,rgba(255,170,110,.28) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}

/* Top bar */
.topbar{flex:0 0 auto;position:relative;z-index:35;width:100%;max-width:600px;margin:0 auto;
  display:flex;justify-content:space-between;align-items:center;
  padding:calc(var(--safe-top) + 10px) 16px 8px;pointer-events:none}
.topbar::before{content:"";position:absolute;inset:0;z-index:-1;
  background:linear-gradient(180deg,rgba(0,0,0,.6),rgba(0,0,0,0));pointer-events:none}
.topbar>*{pointer-events:auto}
.pill{height:44px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;padding:0 16px 0 12px;font-weight:700;font-size:15px}
.pill svg{width:20px;height:20px;color:var(--accent)}
.pill .chev{width:14px;height:14px;color:var(--text-3)}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.round svg{width:22px;height:22px}

main{flex:1 1 auto;position:relative;z-index:1;width:100%;max-width:600px;margin:0 auto;
  padding:0 16px calc(var(--bar-h) + 28px);
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
main.locked{overflow:hidden}
.view{animation:enter .3s cubic-bezier(.2,.8,.2,1)}
.view.from-right{animation-name:fromR}.view.from-left{animation-name:fromL}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fromR{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes fromL{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}

.hero{padding:10px 4px 18px}
.kicker{margin:0 0 2px;font-size:15px;font-weight:600;color:var(--accent-soft)}
h1{margin:0;font-size:38px;line-height:1.06;font-weight:800;letter-spacing:-.025em;overflow-wrap:anywhere}
h2{margin:0;font-size:20px;line-height:1.25;font-weight:700;letter-spacing:-.01em}
.sub{margin:8px 0 0;color:var(--text-2);font-size:16px}
.card{border-radius:28px;padding:18px;margin-bottom:14px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.badge{flex:none;font-size:13px;font-weight:700;padding:6px 11px;border-radius:999px;max-width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  background:rgba(255,122,26,.16);color:var(--accent-soft);box-shadow:inset 0 0 0 1px rgba(255,122,26,.35)}

.week{display:flex;align-items:center;gap:18px}
.ring{flex:none;width:124px;height:124px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .big{font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1}
.ring .small{font-size:12.5px;color:var(--text-2);margin-top:4px}
.week-side{min-width:0}
.week-side p{margin:0 0 12px;color:var(--text-2);font-size:15px}
.week-side strong{color:var(--text)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;font-weight:700;font-size:16px;white-space:nowrap}
.btn:disabled{opacity:.4}
.btn-primary{background:linear-gradient(180deg,#FF9440,#FF6A00);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 24px rgba(255,106,0,.3)}
.btn-ghost{background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.btn-block{width:100%}

.coach-id{display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;background:linear-gradient(160deg,#FF9440,#B84200);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.avatar svg{width:20px;height:20px}
.coach-id small{display:block;color:var(--text-3);font-size:13px;line-height:1.2}
.notes p{margin:0 0 12px;font-size:16.5px;line-height:1.6;color:rgba(255,255,255,.88)}
.callout{border-radius:18px;padding:13px 15px;margin:4px 0 12px;font-size:15.5px;line-height:1.5;background:rgba(255,122,26,.12);box-shadow:inset 0 0 0 1px rgba(255,122,26,.28)}
.callout b{color:var(--accent-soft)}
.callout.neutral{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--hair)}
.callout.neutral b{color:var(--text)}
.empty-note{color:var(--text-3);margin:0}
.notes-same summary{list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:44px;
  padding:0 14px;border-radius:14px;cursor:pointer;color:var(--text-2);font-size:15px;font-weight:600;
  background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--hair)}
.notes-same summary::-webkit-details-marker{display:none}
.notes-same summary svg{width:16px;height:16px;flex:none;color:var(--text-3);transition:transform .3s ease}
.notes-same[open] summary{margin-bottom:14px}
.notes-same[open] summary svg{transform:rotate(180deg)}
.line .prev{font-size:13.5px;color:var(--text-3);margin-top:4px}

.section-title{margin:26px 4px 12px;font-size:22px;font-weight:700}
.srow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border-radius:24px;padding:14px 16px;margin-bottom:10px}
.srow .ic{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;flex:none;background:rgba(255,122,26,.15);color:var(--accent);box-shadow:inset 0 0 0 1px rgba(255,122,26,.3)}
.srow .ic svg{width:24px;height:24px}
.srow .txt{flex:1;min-width:0;display:block}
.srow .txt>span{display:block}
.srow .t1{font-weight:700;font-size:17px;line-height:1.25}
.srow .t2{color:var(--text-2);font-size:14.5px;line-height:1.35;margin-top:2px}
.srow .t0{color:var(--text-3);font-size:13px;line-height:1.2;margin-bottom:2px}
.srow .st{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22)}
.srow .st svg{width:14px;height:14px}
.srow.done .st{background:var(--z2);box-shadow:none;color:#002b27}
.srow.done .ic{background:rgba(79,209,197,.14);color:var(--z2);box-shadow:inset 0 0 0 1px rgba(79,209,197,.3)}
.opt{font-size:12px;font-weight:600;color:var(--text-3);margin-left:6px}

.coach-note{display:flex;gap:10px;margin:0 0 16px;color:var(--text-2);font-size:15.5px;line-height:1.5}
.coach-note svg{flex:none;width:18px;height:18px;margin-top:2px;color:var(--accent)}
.lines{display:flex;flex-direction:column}
.line{display:flex;gap:14px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--hair)}
.line:first-child{border-top:0;padding-top:4px}
.q{flex:none;min-width:62px;max-width:40%;font-weight:800;font-size:19px;letter-spacing:-.02em;color:var(--accent);line-height:1.3}
.line .body{flex:1;min-width:0}
.line .t{font-size:18px;font-weight:600;line-height:1.3;display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;overflow-wrap:anywhere}
.line .pre{color:var(--text-3);font-weight:700}
.line .r,.line .s{font-size:15px;color:var(--text-2);margin-top:3px;line-height:1.4}
.line .s{color:var(--text-3)}
.chip{font-size:12.5px;font-weight:800;padding:3px 9px;border-radius:999px;line-height:1.3;white-space:nowrap}
.chip.z2{background:rgba(79,209,197,.16);color:var(--z2)}
.chip.z3{background:rgba(246,195,67,.16);color:var(--z3)}
.chip.z4{background:rgba(255,122,26,.18);color:var(--z4)}
.chip.z5{background:rgba(255,77,77,.18);color:var(--z5)}
.chip.z23{background:linear-gradient(90deg,rgba(79,209,197,.2),rgba(246,195,67,.2));color:#d9f1c9}
.chip.pct{background:rgba(255,255,255,.1);color:var(--text)}

.rt-wrap{overflow-x:auto;margin:0 -4px;-webkit-overflow-scrolling:touch}
table.rt{width:100%;border-collapse:collapse}
.rt th{font-size:13px;color:var(--text-3);font-weight:600;text-align:right;padding:0 8px 8px;white-space:nowrap}
.rt th:first-child{text-align:left}
.rt td{white-space:nowrap;padding:12px 8px;border-top:1px solid var(--hair);text-align:right;font-weight:800;font-size:17px}
.rt td:first-child{text-align:left;font-weight:600;font-size:16.5px;white-space:normal}
.rt tr td:nth-child(2){color:var(--accent)}
.loads{margin-top:14px;border-radius:18px;background:rgba(0,0,0,.28);padding:2px 14px}
.load{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;align-items:baseline;padding:12px 0;border-top:1px solid var(--hair)}
.load:first-child{border-top:0}
.load .n{grid-column:1/-1;font-weight:600}
.load small{display:block;font-size:12px;color:var(--text-3);font-weight:600}
.load .rx{font-weight:800;color:var(--accent-soft)}
.load .sc{color:var(--text-2);font-size:14.5px}
.ladder{display:grid;grid-template-columns:repeat(auto-fit,minmax(26px,1fr));gap:5px;margin:0 0 14px}
.ladder span{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:14px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px var(--hair)}
.ladder span:first-child{background:rgba(255,122,26,.2);color:var(--accent-soft)}

.seg{display:flex;padding:4px;border-radius:999px;background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 1px var(--hair);margin-bottom:16px;position:relative}
.seg button{flex:1;min-height:40px;border-radius:999px;font-weight:600;font-size:15px;color:var(--text-2);position:relative;z-index:1;transition:color .2s}
.seg button[aria-pressed="true"]{color:#fff}
.seg .knob{position:absolute;top:4px;bottom:4px;left:0;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.08));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 4px 14px rgba(0,0,0,.35);transition:transform .38s cubic-bezier(.3,1.35,.5,1),width .38s}
.total{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;padding-top:14px;border-top:1px solid var(--hair);color:var(--text-2);font-size:15px}
.total b{font-size:22px;color:var(--text);letter-spacing:-.02em}

.calc{margin-top:16px;border-radius:20px;background:rgba(0,0,0,.3);padding:14px;box-shadow:inset 0 0 0 1px var(--hair)}
.calc label{display:block;font-size:14px;color:var(--text-2);margin-bottom:8px}
.calc .in{display:flex;align-items:center;gap:8px}
.calc input{width:120px;min-height:44px;border-radius:14px;border:0;padding:0 14px;font-size:18px;font-weight:700;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.calc input:focus{outline:2px solid var(--accent);outline-offset:1px}
.calc .unit{color:var(--text-3);font-size:15px}
.calc .outs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:12px}
.calc .o{border-radius:14px;padding:10px 12px;background:rgba(255,255,255,.05)}
.calc .o small{display:block;color:var(--text-3);font-size:12.5px;line-height:1.3}
.calc .o b{font-size:19px;letter-spacing:-.02em}
.calc .o b.empty{color:var(--text-3);font-weight:600}
.calc.single{display:grid;grid-template-columns:1fr minmax(110px,40%);gap:0 10px;align-items:end}
.calc.single .outs{margin-top:0;display:block}
.calc.single input{width:100%;max-width:130px}

/* Done toggle: small and light */
.done-wrap{display:flex;justify-content:center;margin-top:18px}
.done-toggle{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 16px 0 10px;border-radius:999px;font-size:14.5px;font-weight:600;color:var(--text-2);
  background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);transition:background .25s,color .25s}
.done-toggle .box{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35);transition:background .25s,box-shadow .25s,transform .3s cubic-bezier(.3,1.6,.5,1)}
.done-toggle .box svg{width:13px;height:13px;opacity:0;transition:opacity .2s}
.done-toggle.on{color:var(--z2);background:rgba(79,209,197,.1);box-shadow:inset 0 0 0 1px rgba(79,209,197,.3)}
.done-toggle.on .box{background:var(--z2);box-shadow:none;color:#002b27;transform:scale(1.08)}
.done-toggle.on .box svg{opacity:1}
.swipe-hint{text-align:center;color:var(--text-3);font-size:12.5px;margin:14px 0 0}

/* Tab bar — swipeable */
.tabwrap{position:absolute;left:0;right:0;bottom:0;z-index:40;pointer-events:none;
  padding:0 10px 16px}
/* Con la tastiera aperta il viewport si accorcia: usiamo l'altezza misurata e togliamo la navbar. */
/* L'altezza piena si misura a runtime (fitShell): su alcuni iPhone 100lvh eccede l'area visibile
   e taglierebbe la navbar, quindi di base la shell resta ancorata sopra e sotto. */
html.tall body{bottom:auto;height:var(--screen-h)}
html.kb body{bottom:auto;height:var(--vh,100%)}
html.kb .tabwrap{display:none}
.tabbar{pointer-events:auto;max-width:560px;margin:0 auto;border-radius:34px;padding:6px;
  background:linear-gradient(160deg,rgba(40,40,40,.55),rgba(20,20,20,.45));
  transform-origin:50% 100%;will-change:transform;
  transition:transform .42s cubic-bezier(.22,1,.36,1),opacity .26s ease}
@supports (transition-timing-function:linear(0,1)){
  /* Molla con smorzamento 0.88, come le animazioni di sistema iOS: nessun rimbalzo visibile,
     rallenta in modo graduale invece di fermarsi di colpo. */
  .tabbar{transition:transform .5s linear(0, 0.0442, 0.1463, 0.2726, 0.4023, 0.5235, 0.63, 0.7198, 0.7929, 0.8507, 0.8952, 0.9287, 0.9533, 0.9709, 0.9831, 0.9914, 0.9967, 1, 1.0018, 1.0027, 1.003, 1.0029, 1.0026, 1.0022, 1.0018, 1),opacity .26s ease}
}
/* Scroll verso il basso: la barra si ritrae. Scroll verso l'alto: torna piena. */
html.nav-min .tabbar{transform:scale(.7);opacity:.92}
@media (prefers-reduced-motion:reduce){html.nav-min .tabbar{transform:none;opacity:1}}
.track{position:relative;display:flex;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;border-radius:28px}
.track::-webkit-scrollbar{display:none}
.track.fade-r{-webkit-mask-image:linear-gradient(90deg,#000 85%,transparent);mask-image:linear-gradient(90deg,#000 85%,transparent)}
.track.fade-l{-webkit-mask-image:linear-gradient(90deg,transparent,#000 15%);mask-image:linear-gradient(90deg,transparent,#000 15%)}
.track.fade-l.fade-r{-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.tab{flex:1 0 auto;min-width:66px;height:56px;padding:0 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:28px;
  color:var(--text-2);position:relative;z-index:1;transition:color .25s;scroll-snap-align:center;-webkit-user-select:none;user-select:none}
.tab svg{width:23px;height:23px}
.tab span{font-size:10.5px;font-weight:600;line-height:1;white-space:nowrap}
.tab[aria-current="page"]{color:var(--accent)}
.tab .dot{position:absolute;top:8px;right:calc(50% - 17px);width:7px;height:7px;border-radius:50%;background:var(--z2);display:none}
.tab.done .dot{display:block}
.lens{position:absolute;top:0;bottom:0;left:0;border-radius:28px;z-index:0;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.06));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(255,255,255,.1),0 6px 18px rgba(0,0,0,.4);
  transition:transform .45s cubic-bezier(.3,1.3,.5,1),width .45s cubic-bezier(.3,1.3,.5,1)}
@supports (transition-timing-function:linear(0,1)){
  .lens{transition:transform .56s linear(0, 0.046, 0.1521, 0.2831, 0.4171, 0.5416, 0.6502, 0.7407, 0.8135, 0.8701, 0.913, 0.9444, 0.9667, 0.9821, 0.9923, 0.9987, 1.0024, 1.0043, 1.005, 1.0049, 1.0045, 1.0039, 1.0032, 1.0026, 1.002, 1),width .56s linear(0, 0.046, 0.1521, 0.2831, 0.4171, 0.5416, 0.6502, 0.7407, 0.8135, 0.8701, 0.913, 0.9444, 0.9667, 0.9821, 0.9923, 0.9987, 1.0024, 1.0043, 1.005, 1.0049, 1.0045, 1.0039, 1.0032, 1.0026, 1.002, 1)}
}

/* Sheets */
.backdrop{position:absolute;inset:0;z-index:60;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .25s}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;max-width:600px;margin:0 auto;max-height:88%;display:flex;flex-direction:column;
  border-radius:32px 32px 0 0;background:linear-gradient(170deg,rgba(44,40,38,.92),rgba(18,16,15,.96));-webkit-backdrop-filter:blur(40px) saturate(180%);backdrop-filter:blur(40px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 -10px 40px rgba(0,0,0,.5);
  transform:translateY(105%);transition:transform .4s cubic-bezier(.2,.9,.2,1);padding-bottom:max(12px,var(--safe-bot))}
.sheet.open{transform:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:10px 18px 8px;position:relative}
.sheet-head::before{content:"";position:absolute;top:7px;left:50%;width:38px;height:5px;margin-left:-19px;border-radius:3px;background:rgba(255,255,255,.25)}
.sheet-head h2{font-size:20px;padding-top:12px}
.sheet-head .round{margin-top:10px;width:36px;height:36px;background:rgba(255,255,255,.1)}
.sheet-head .round svg{width:16px;height:16px}
.sheet-body{overflow-y:auto;padding:6px 18px 22px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.help{color:var(--text-2);font-size:15px;margin:0 0 12px}
textarea{width:100%;min-height:200px;border:0;border-radius:18px;padding:14px;font-size:16px;line-height:1.45;resize:vertical;
  background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.row-btns{display:flex;gap:10px;margin-top:12px}
.row-btns .btn{flex:1}
.preview{margin-top:16px;border-radius:20px;padding:14px 16px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--hair)}
.preview h3{margin:0 0 4px;font-size:17px}
.preview ol{margin:8px 0 0;padding-left:20px;color:var(--text-2);font-size:15px}
.preview .num{display:flex;align-items:center;gap:10px;margin:10px 0 14px;color:var(--text-2);font-size:15px}
.preview .num input{width:80px;min-height:40px;border:0;border-radius:12px;padding:0 12px;font-size:17px;font-weight:700;background:rgba(0,0,0,.35);box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.err{color:#FF8A7A;font-size:15px;margin:12px 0 0}
.ok{color:var(--z2);font-size:15px;margin:12px 0 0}
.group-title{margin:24px 0 8px;font-size:13.5px;color:var(--text-3);font-weight:600}
.wrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:18px;background:rgba(255,255,255,.05);margin-bottom:8px;min-height:60px}
.wrow.active{background:rgba(255,122,26,.14);box-shadow:inset 0 0 0 1px rgba(255,122,26,.35)}
.wrow .wt{flex:1;min-width:0}
.wrow .wt b{display:block;font-size:17px}
.wrow .wt small{display:block;color:var(--text-3);font-size:13.5px}
.wrow .mini{flex:none;font-weight:700;font-size:14px;color:var(--text-2)}
.wrow .del{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#FF8A7A;background:rgba(255,80,60,.1)}
.wrow .del svg{width:18px;height:18px}
.wrow .chk{flex:none;color:var(--accent)}
.wrow .chk svg{width:20px;height:20px}
.loading{min-height:60vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:var(--text-2);text-align:center;padding:0 20px}
.err-box p{max-width:30ch;margin:0}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid rgba(255,255,255,.15);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.diag{position:absolute;left:8px;right:8px;top:8px;z-index:90;border-radius:18px;padding:12px 14px;
  background:rgba(10,10,10,.94);box-shadow:inset 0 0 0 1px rgba(255,255,255,.2);
  font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre;overflow:auto;max-height:70%}
.diag b{display:block;font:600 13px/1.4 -apple-system,system-ui;margin-bottom:6px;color:var(--accent-soft)}
.diag button{margin-top:10px;min-height:36px;padding:0 14px;border-radius:999px;background:rgba(255,255,255,.12);font:600 13px system-ui}
.toast{position:absolute;left:50%;bottom:calc(var(--bar-h) + 16px);z-index:70;transform:translate(-50%,20px);opacity:0;
  padding:10px 16px;border-radius:999px;font-size:14.5px;font-weight:600;transition:opacity .25s,transform .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (max-width:370px){h1{font-size:32px}.q{min-width:52px;font-size:17px}.ring{width:106px;height:106px}.ring .big{font-size:27px}.tab{min-width:60px}}
@media (min-width:700px){main{padding-top:10px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="ambient" aria-hidden="true"><i class="a"></i><i class="b"></i><i class="c"></i></div>

<header class="topbar">
  <button class="pill glass" id="weekBtn" aria-haspopup="dialog"></button>
</header>

<main id="app"></main>

<div class="tabwrap"><nav class="tabbar glass" aria-label="Sezioni"><div class="track" id="track"><div class="lens" id="lens"></div></div></nav></div>

<div class="backdrop" id="backdrop"></div>
<section class="sheet" id="sheetWeeks" role="dialog" aria-modal="true" aria-labelledby="swT" aria-hidden="true">
  <div class="sheet-head"><h2 id="swT">Settimane</h2><button class="round" data-close aria-label="Chiudi"></button></div>
  <div class="sheet-body" id="weeksBody"></div>
</section>
<div class="toast glass" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- Icons ---------- */
const ICONS = {
  home: '<path d="M3.5 10.5 12 4l8.5 6.5V20a1 1 0 0 1-1 1H15v-6H9v6H4.5a1 1 0 0 1-1-1z"/>',
  run: '<circle cx="14.5" cy="4.5" r="2"/><path d="M6 21l3.5-5.5 3 2.5V22M9.5 15.5 11 9l4 2.5 3.5.5M11 9l-3.2 1.2L6 13"/>',
  kb: '<path d="M9 9.5V7a3 3 0 0 1 6 0v2.5"/><circle cx="12" cy="15" r="6"/>',
  bike: '<circle cx="5.5" cy="16.5" r="3.5"/><circle cx="18.5" cy="16.5" r="3.5"/><path d="M5.5 16.5 9.5 9h5.5l3.5 7.5M9.5 9l3.5 7.5H5.5M13.5 6H16"/>',
  bar: '<path d="M2 12h20M5.5 8v8M8.5 6v12M15.5 6v12M18.5 8v8"/>',
  swim: '<circle cx="17" cy="6" r="2"/><path d="M4 12.5l5-3.5 3 3 3.5-1.5M2 17c2 0 2-1.5 4-1.5S8 17 10 17s2-1.5 4-1.5 2 1.5 4 1.5 2-1.5 4-1.5M2 21c2 0 2-1.5 4-1.5S8 21 10 21s2-1.5 4-1.5 2 1.5 4 1.5 2-1.5 4-1.5"/>',
  row: '<path d="M4 20 17 7"/><path d="M15.5 3.5l5 5-3.5 1-2.5-2.5z"/><path d="M2.5 15.5h7"/>',
  ski: '<path d="M8 3v18M16 3v18M5 21h6M13 21h6M8 8l4-3 4 3"/>',
  gym: '<path d="M4 4h16M8 4v4a4 4 0 0 0 8 0V4M12 12v9"/>',
  check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  quote: '<path d="M4 20l1.5-4.5A8 8 0 1 1 8.5 19z"/>',
  whistle: '<circle cx="9" cy="14" r="5"/><path d="M12.5 10.5 21 6v4l-7 2.5M9 14h.01"/>',
  cal: '<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  chev: '<path d="M6 9l6 6 6-6"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/>',
  plus: '<path d="M12 5v14M5 12h14"/>'
};
const svg = (n, w = 1.9) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ICONS.kb}</svg>`;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const cap = s => { s = String(s || "").trim(); return s ? s[0].toUpperCase() + s.slice(1) : s; };

/* ---------- Storage (locale: solo progressi e preferenze) ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
};
/* ---------- Database programmazione: data/program.json ---------- */
const DB_URL = "data/program.json";
let weeks = [], curNum = null;
const sortWeeks = () => weeks.sort((a, b) => b.number - a.number);
const W = () => weeks.find(w => w.number === curNum) || weeks[0];
const doneKey = () => `hpg-w${W().number}-done`;
const getDone = (n = W().number) => store.get(`hpg-w${n}-done`, []);
const isDone = i => getDone().includes(i);
function toggleDone(i) { const d = getDone(); store.set(doneKey(), d.includes(i) ? d.filter(x => x !== i) : [...d, i]); }
async function fetchDB() {
  // L'hosting ogni tanto rifiuta richieste ravvicinate: un secondo tentativo risolve.
  for (let i = 0; i < 2; i++) {
    try {
      const r = await fetch(DB_URL + "?t=" + Date.now(), { cache: "no-store" });
      if (r.ok) return await r.json();
      if (i === 0) await new Promise(res => setTimeout(res, 1200));
      else throw new Error("HTTP " + r.status);
    } catch (e) {
      if (i === 1) throw e;
      await new Promise(res => setTimeout(res, 1200));
    }
  }
}
async function loadDB() {
  try {
    const db = await fetchDB();
    if (!db || !Array.isArray(db.weeks)) throw new Error("formato");
    store.set("hpg-db-cache", db); return { db, offline: false };
  } catch (e) {
    const db = store.get("hpg-db-cache", null);
    if (db) return { db, offline: true };
    throw e;
  }
}

/* ---------- Toast ---------- */
let toastT;
function toast(msg) { const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2200); }

/* ---------- Tabs ---------- */
const track = document.getElementById("track"), lens = document.getElementById("lens");
let TABS = [];
function buildTabs() {
  track.querySelectorAll(".tab").forEach(b => b.remove());
  TABS = [{ id: "home", label: "Home", icon: "home" }, ...W().sessions.map((s, i) => ({ id: "s" + (i + 1), label: s.tab || "G" + (i + 1), icon: s.icon, idx: i }))];
  TABS.forEach(t => {
    const b = document.createElement("button");
    b.className = "tab"; b.dataset.id = t.id;
    b.setAttribute("aria-label", t.idx === undefined ? "Home" : `Allenamento ${t.idx + 1}, ${t.label}`);
    b.innerHTML = svg(t.icon) + `<span>${esc(t.label)}</span><i class="dot"></i>`;
    b.addEventListener("click", () => go(t.id));
    track.appendChild(b);
  });
  if (typeof fitShell === "function") fitShell();
}
function syncTabs(id, smooth = true) {
  track.querySelectorAll(".tab").forEach((b, i) => {
    const on = b.dataset.id === id;
    on ? b.setAttribute("aria-current", "page") : b.removeAttribute("aria-current");
    b.classList.toggle("done", i > 0 && isDone(i - 1));
    if (on) {
      lens.style.width = b.offsetWidth + "px"; lens.style.transform = `translateX(${b.offsetLeft}px)`;
      const target = b.offsetLeft - (track.clientWidth - b.offsetWidth) / 2;
      track.scrollTo({ left: Math.max(0, target), behavior: smooth ? "smooth" : "auto" });
    }
  });
  fades();
}
function fades() {
  const max = track.scrollWidth - track.clientWidth;
  track.classList.toggle("fade-l", track.scrollLeft > 4);
  track.classList.toggle("fade-r", track.scrollLeft < max - 4);
}
track.addEventListener("scroll", fades, { passive: true });

/* ---------- Top bar ---------- */
function syncTop() {
  if (!weeks.length) return;
  document.getElementById("weekBtn").innerHTML = `${svg("cal")}<span>Sett. ${W().number}</span>${svg("chev", 2.4).replace("<svg", '<svg class="chev"')}`;
  document.getElementById("weekBtn").setAttribute("aria-label", `Settimana ${W().number}, cambia settimana`);
}

/* ---------- Routing ---------- */
const app = document.getElementById("app");
function current() { const h = location.hash.slice(1); return TABS.some(t => t.id === h) ? h : "home"; }
let lastIdx = 0, navDir = "";
function go(id) { if (location.hash.slice(1) !== id) location.hash = id; else render(); }
window.addEventListener("hashchange", () => render());
window.addEventListener("resize", () => { fitShell(); syncTabs(current(), false); });

function render(opts = {}) {
  const id = current(), idx = TABS.findIndex(t => t.id === id);
  const dir = opts.fresh ? "" : idx > lastIdx ? " from-right" : idx < lastIdx ? " from-left" : "";
  lastIdx = idx;
  app.innerHTML = `<div class="view${dir}">${id === "home" ? homeView() : sessionView(+id.slice(1) - 1)}</div>`;
  bind(id);
  syncTabs(id, !opts.fresh);
  if (typeof fitShell === "function") fitShell();
  if (typeof navReset === "function") navReset();
  app.scrollTop = 0;
}

/* ---------- Home ---------- */
function ringSVG() {
  const S = W().sessions, n = S.length || 1, r = 50, C = 2 * Math.PI * r, gap = n > 1 ? 7 : 0, seg = C / n - gap;
  let out = `<circle cx="62" cy="62" r="${r}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="14"/>`;
  S.forEach((s, i) => {
    const col = isDone(i) ? (s.optional ? "#4FD1C5" : "url(#g)") : "rgba(255,255,255,.16)";
    out += `<circle cx="62" cy="62" r="${r}" fill="none" stroke="${col}" stroke-width="${s.optional ? 6 : 12}" stroke-linecap="round" stroke-dasharray="${seg} ${C - seg}" stroke-dashoffset="${-(i * C / n) - gap / 2}"/>`;
  });
  return `<svg viewBox="0 0 124 124" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB070"/><stop offset="1" stop-color="#FF6A00"/></linearGradient></defs>${out}</svg>`;
}
function prevWeek(w) {
  return weeks.filter(x => x.number < w.number).sort((a, b) => b.number - a.number)[0] || null;
}
function notesUnchangedSince(w) {
  const key = JSON.stringify(w.notes || []);
  let since = null, cur = w;
  for (let p = prevWeek(cur); p && JSON.stringify(p.notes || []) === key; p = prevWeek(p)) since = p.number;
  return since;
}
function homeView() {
  const w = W(), S = w.sessions;
  const req = S.filter(s => !s.optional).length, reqDone = S.filter((s, i) => !s.optional && isDone(i)).length;
  const next = S.findIndex((s, i) => !isDone(i) && !s.optional);
  const notesBody = (w.notes || []).map(n => typeof n === "string" ? `<p>${esc(n)}</p>` : `<div class="callout${n.neutral ? " neutral" : ""}">${n.callout}</div>`).join("") || `<p class="empty-note">Nessuna nota per questa settimana.</p>`;
  // Se il coach ha ricopiato le stesse note, le comprimiamo: la home mostra subito gli allenamenti.
  const since = notesUnchangedSince(w);
  const notes = since
    ? `<details class="notes-same"><summary><span>Invariate dalla settimana ${since}</span>${svg("chev", 2.4)}</summary>${notesBody}</details>`
    : notesBody;
  const rows = S.map((s, i) => `
    <button class="srow glass${isDone(i) ? " done" : ""}" data-go="s${i + 1}">
      <span class="ic">${svg(s.icon)}</span>
      <span class="txt"><span class="t0">Allenamento ${i + 1}${s.optional ? '<span class="opt">facoltativo</span>' : ""}</span>
        <span class="t1">${esc(s.title)}</span><span class="t2">${esc(s.summary)}</span></span>
      <span class="st" aria-label="${isDone(i) ? "Completato" : "Da fare"}">${isDone(i) ? svg("check", 3) : ""}</span>
    </button>`).join("");
  return `
    <header class="hero"><p class="kicker">${esc(w.program)}</p><h1>Settimana ${w.number}</h1></header>
    <section class="card glass" aria-label="Avanzamento settimana"><div class="week">
      <div class="ring">${ringSVG()}<div class="center"><div class="big">${reqDone}/${req}</div><div class="small">sessioni fatte</div></div></div>
      <div class="week-side">${next === -1
        ? `<p><strong>Settimana completata.</strong>${S.some(s => s.optional) ? " Se hai energie, resta la sessione facoltativa." : ""}</p>`
        : `<p>Prossima: <strong>${esc(S[next].title)}</strong></p><button class="btn btn-primary" data-go="s${next + 1}">Inizia</button>`}</div>
    </div></section>
    <section class="card glass notes" aria-label="Note del coach">
      <div class="card-head"><div class="coach-id"><span class="avatar">${svg("whistle", 2)}</span><div><h2>Note del coach</h2><small>Settimana ${w.number}</small></div></div></div>
      ${notes}
    </section>
    <h2 class="section-title">Allenamenti</h2>${rows}`;
}

/* ---------- Session ---------- */
const zoneClass = z => /%/.test(z) ? "pct" : /Z2\s*[–\-\/]\s*Z?3/i.test(z) ? "z23" : /Z2/i.test(z) ? "z2" : /Z3/i.test(z) ? "z3" : /Z4/i.test(z) ? "z4" : /Z5/i.test(z) ? "z5" : "pct";
// Carichi a percentuale della settimana precedente, per mostrare la progressione.
let PREV_LOAD = null;
function buildPrevLoad(w) {
  const p = prevWeek(w), map = {};
  if (p) p.sessions.forEach(s => s.blocks.forEach(b => (b.lines || []).forEach(l => {
    if (l.z && /%/.test(l.z) && !/BW/.test(l.z)) map[l.t.toLowerCase()] = { q: l.q, z: l.z };
  })));
  return p ? { n: p.number, map } : null;
}
function lineHTML(l) {
  const chips = [...(l.z ? [l.z] : []), ...(l.chips || [])];
  let prev = "";
  if (PREV_LOAD && l.z && /%/.test(l.z) && !/BW/.test(l.z)) {
    const o = PREV_LOAD.map[l.t.toLowerCase()];
    // "all'80%", "all'11%" ma "al 75%": l'articolo segue il suono del numero.
    const art = o && /^(8|11)/.test(o.z) ? "all'" : "al ";
    if (o && (o.q !== l.q || o.z !== l.z)) prev = `<div class="prev">Settimana ${PREV_LOAD.n}: ${esc(o.q)} ${art}${esc(o.z)}</div>`;
  }
  return `<div class="line">${l.q ? `<div class="q">${esc(l.q)}</div>` : ""}<div class="body">
    <div class="t">${l.pre ? `<span class="pre">${esc(l.pre)})</span>` : ""}${esc(l.t)}${chips.map(z => `<span class="chip ${zoneClass(z)}">${esc(z)}</span>`).join("")}</div>
    ${l.r ? `<div class="r">${esc(l.r)}</div>` : ""}${l.s ? `<div class="s">${esc(l.s)}</div>` : ""}${prev}</div></div>`;
}
function calcHTML(c, bi, ci) {
  const v = store.get("hpg-" + c.key, "");
  return `<div class="calc${c.outs.length === 1 ? " single" : ""}" data-calc="${bi}-${ci}"><div><label for="c-${bi}-${ci}">${esc(c.label)}</label>
    <div class="in"><input id="c-${bi}-${ci}" inputmode="${c.kind === "pace" ? "text" : "decimal"}" placeholder="${c.kind === "pace" ? "4:45" : "—"}" value="${esc(v)}" autocomplete="off" enterkeyhint="done">
    <span class="unit">${c.kind === "pace" ? "min/km" : esc(c.unit)}</span></div></div>
    <div class="outs">${c.outs.map((o, oi) => `<div class="o"><small>${esc(o.label)}</small><b data-out="${oi}" class="empty">—</b></div>`).join("")}</div></div>`;
}
const sumM = L => L.reduce((a, l) => a + (l.m || 0), 0);
function blockHTML(b, bi) {
  let h = `<section class="card glass"><div class="card-head"><h2>${esc(b.title)}</h2>${b.badge ? `<span class="badge">${esc(b.badge)}</span>` : ""}</div>`;
  if (b.note) h += `<p class="coach-note">${svg("quote")}<span>${esc(b.note)}</span></p>`;
  if (b.ladder) h += `<div class="ladder" aria-label="Ripetizioni ${b.ladder.join(", ")}">${b.ladder.map(n => `<span>${n}</span>`).join("")}</div>`;
  if (b.table) h += `<div class="rt-wrap"><table class="rt"><thead><tr>${b.table.cols.map(c => `<th scope="col">${esc(c)}</th>`).join("")}</tr></thead><tbody>${b.table.rows.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  if (b.lines && b.lines.length) h += `<div class="lines">${b.lines.map(lineHTML).join("")}</div>`;
  if (b.levels) {
    const keys = Object.keys(b.levels), sel = store.get("hpg-lvl", keys[0]), cur = keys.includes(sel) ? sel : keys[0];
    const tot = sumM(b.levels[cur]);
    h += `<div class="seg" role="group" aria-label="Livello" data-block="${bi}"><span class="knob"></span>${keys.map(k => `<button aria-pressed="${k === cur}" data-lvl="${esc(k)}">${esc(k)}</button>`).join("")}</div>
      <div class="lines" id="lvl-lines-${bi}">${b.levels[cur].map(lineHTML).join("")}</div>
      <div class="total" id="lvl-tot-${bi}" ${tot ? "" : "hidden"}><span>Totale</span><b>${tot.toLocaleString("it-IT")} m</b></div>`;
  }
  if (b.loads && b.loads.length) h += `<div class="loads">${b.loads.map(l => `<div class="load"><span class="n">${esc(l.n)}</span><span class="rx"><small>Rx</small>${esc(l.rx)}</span>${l.sc ? `<span class="sc"><small>Scaled</small>${esc(l.sc)}</span>` : ""}</div>`).join("")}</div>`;
  if (b.callout) h += `<div class="callout" style="margin-top:16px;margin-bottom:0">${b.callout}</div>`;
  if (b.calcs) h += b.calcs.map((c, ci) => calcHTML(c, bi, ci)).join("");
  return h + `</section>`;
}
function doneBtn(i) {
  const on = isDone(i);
  return `<button class="done-toggle${on ? " on" : ""}" data-done="${i}" aria-pressed="${on}"><span class="box">${svg("check", 3)}</span><span class="lbl">${on ? "Completato" : "Segna come fatto"}</span></button>`;
}
function sessionView(i) {
  const s = W().sessions[i];
  if (!s) return homeView();
  PREV_LOAD = buildPrevLoad(W());
  return `<header class="hero"><p class="kicker">Allenamento ${i + 1}${s.optional ? ", facoltativo" : ""}</p><h1>${esc(s.title)}</h1>${s.summary ? `<p class="sub">${esc(s.summary)}</p>` : ""}</header>
    ${s.blocks.map(blockHTML).join("")}
    <div class="done-wrap">${doneBtn(i)}</div>`;
}

/* ---------- Calculators ---------- */
const parsePace = s => { const m = String(s).trim().match(/^(\d{1,2})\s*[:.,'′ ]\s*(\d{1,2})$/); return m ? (+m[1]) * 60 + (+m[2]) : null; };
const fmtPace = sec => `${Math.floor(sec / 60)}:${String(Math.round(sec % 60)).padStart(2, "0")}/km`;
function updateCalc(el, c) {
  const raw = el.querySelector("input").value;
  store.set("hpg-" + c.key, raw);
  el.querySelectorAll("[data-out]").forEach(o => {
    const out = c.outs[+o.dataset.out]; let txt = null;
    if (c.kind === "pace") { const p = parsePace(raw); if (p) txt = fmtPace(p + out.off); }
    else { const n = parseFloat(String(raw).replace(",", ".")); if (n > 0) {
      const v = n * out.pct / 100, r = c.unit === "W" ? Math.round(v) : Math.round(v * 2) / 2;
      txt = r.toLocaleString("it-IT") + " " + c.unit; } }
    o.textContent = txt || "—"; o.classList.toggle("empty", !txt);
  });
}

/* ---------- Bindings ---------- */
function placeKnob(seg) { const on = seg.querySelector('[aria-pressed="true"]'), k = seg.querySelector(".knob"); if (on) { k.style.width = on.offsetWidth + "px"; k.style.transform = `translateX(${on.offsetLeft}px)`; } }
function bind(id) {
  app.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => go(b.dataset.go)));
  if (id === "home") return;
  const i = +id.slice(1) - 1, s = W().sessions[i]; if (!s) return;
  const db = app.querySelector("[data-done]");
  db.addEventListener("click", () => {
    toggleDone(i); const on = isDone(i);
    db.classList.toggle("on", on); db.setAttribute("aria-pressed", on);
    db.querySelector(".lbl").textContent = on ? "Completato" : "Segna come fatto";
    if (on && navigator.vibrate) navigator.vibrate(12);
    syncTabs(id);
  });
  s.blocks.forEach((b, bi) => {
    (b.calcs || []).forEach((c, ci) => { const el = app.querySelector(`[data-calc="${bi}-${ci}"]`); el.querySelector("input").addEventListener("input", () => updateCalc(el, c)); updateCalc(el, c); });
    const seg = app.querySelector(`.seg[data-block="${bi}"]`);
    if (seg) {
      placeKnob(seg);
      seg.querySelectorAll("button").forEach(btn => btn.addEventListener("click", () => {
        seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === btn));
        store.set("hpg-lvl", btn.dataset.lvl);
        const L = b.levels[btn.dataset.lvl], tot = sumM(L), te = app.querySelector(`#lvl-tot-${bi}`);
        app.querySelector(`#lvl-lines-${bi}`).innerHTML = L.map(lineHTML).join("");
        te.hidden = !tot; te.querySelector("b").textContent = tot.toLocaleString("it-IT") + " m";
        placeKnob(seg);
      }));
    }
  });
}

/* ---------- Swipe between tabs ---------- */
let sx = 0, sy = 0, st = 0, swipeOk = false;
app.addEventListener("touchstart", e => {
  const t = e.touches[0]; sx = t.clientX; sy = t.clientY; st = Date.now();
  swipeOk = !e.target.closest(".rt-wrap, input, textarea, .seg") && !openSheet;
}, { passive: true });
app.addEventListener("touchend", e => {
  if (!swipeOk) return;
  const t = e.changedTouches[0], dx = t.clientX - sx, dy = t.clientY - sy;
  if (Math.abs(dx) > 70 && Math.abs(dy) < Math.abs(dx) * 0.5 && Date.now() - st < 600) {
    const idx = TABS.findIndex(x => x.id === current()), n = idx + (dx < 0 ? 1 : -1);
    if (TABS[n]) go(TABS[n].id);
  }
}, { passive: true });

/* ---------- Sheets ---------- */
const backdrop = document.getElementById("backdrop");
let openSheet = null, lastFocus = null;
function showSheet(id) {
  closeSheet(true);
  const el = document.getElementById(id); lastFocus = document.activeElement;
  el.classList.add("open"); el.setAttribute("aria-hidden", "false"); backdrop.classList.add("open");
  app.classList.add("locked"); openSheet = el;
  setTimeout(() => el.querySelector("[data-close]").focus({ preventScroll: true }), 50);
}
function closeSheet(silent) {
  if (!openSheet) return;
  openSheet.classList.remove("open"); openSheet.setAttribute("aria-hidden", "true");
  backdrop.classList.remove("open"); app.classList.remove("locked"); openSheet = null;
  if (!silent && lastFocus) lastFocus.focus({ preventScroll: true });
}
backdrop.addEventListener("click", () => closeSheet());
document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });
document.querySelectorAll("[data-close]").forEach(b => { b.innerHTML = svg("x", 2.4); b.addEventListener("click", () => closeSheet()); });
// drag-down to close
document.querySelectorAll(".sheet").forEach(sh => {
  let y0 = null;
  sh.querySelector(".sheet-head").addEventListener("touchstart", e => { y0 = e.touches[0].clientY; }, { passive: true });
  sh.querySelector(".sheet-head").addEventListener("touchend", e => { if (y0 !== null && e.changedTouches[0].clientY - y0 > 60) closeSheet(); y0 = null; }, { passive: true });
});

function switchWeek(n) {
  curNum = n; store.set("hpg-current", n);
  buildTabs(); syncTop(); closeSheet(true);
  lastIdx = 0; if (location.hash && location.hash !== "#home") location.hash = "home"; else render({ fresh: true });
}

function weeksSheet() {
  const b = document.getElementById("weeksBody");
  b.innerHTML = weeks.map(w => {
    const req = w.sessions.filter(s => !s.optional).length, d = getDone(w.number).filter(i => w.sessions[i] && !w.sessions[i].optional).length;
    return `<button class="wrow${w.number === W().number ? " active" : ""}" data-week="${w.number}">
      <span class="wt"><b>Settimana ${w.number}</b><small>${esc(w.program)}, ${w.sessions.length} allenamenti</small></span>
      <span class="mini">${d}/${req}</span>${w.number === W().number ? `<span class="chk">${svg("check", 2.6)}</span>` : ""}</button>`;
  }).join("");
  b.querySelectorAll("[data-week]").forEach(x => x.addEventListener("click", () => switchWeek(+x.dataset.week)));
}

document.getElementById("weekBtn").addEventListener("click", () => { weeksSheet(); showSheet("sheetWeeks"); });

/* ---------- Altezza della finestra, tastiera e motion della navbar ---------- */
const root = document.documentElement;
if (navigator.standalone === true || ["standalone","fullscreen","minimal-ui"].some(m => matchMedia(`(display-mode: ${m})`).matches)) root.classList.add("pwa");
function fitShell() {
  const vv = window.visualViewport;
  const h = Math.round(vv ? vv.height : window.innerHeight);
  root.style.setProperty("--vh", h + "px");
  // La tastiera aperta riduce la finestra: nascondiamo la navbar invece di farla salire.
  root.classList.toggle("kb", !!vv && window.innerHeight - vv.height > 140);
  if (!vv) root.style.setProperty("--vh", window.innerHeight + "px");
  const bar = document.querySelector(".tabwrap");
  if (bar && !root.classList.contains("kb")) root.style.setProperty("--bar-h", Math.round(bar.offsetHeight) + "px");
}
/* Diagnostica schermo: tieni premuto un secondo sul titolo della settimana. */
function probeH(expr) {
  const d = document.createElement("div");
  d.style.cssText = "position:absolute;top:0;left:0;width:1px;visibility:hidden;height:" + expr;
  document.documentElement.appendChild(d);
  const v = d.getBoundingClientRect().height;
  d.remove();
  return Math.round(v * 10) / 10;
}
function diagText() {
  const vv = window.visualViewport;
  const bar = document.querySelector(".tabbar").getBoundingClientRect();
  const body = document.body.getBoundingClientRect();
  return [
    "innerHeight   " + window.innerHeight,
    "screen        " + screen.width + " x " + screen.height,
    "visualVP      " + (vv ? Math.round(vv.height) : "-"),
    "100lvh        " + probeH("100lvh"),
    "100dvh        " + probeH("100dvh"),
    "100svh        " + probeH("100svh"),
    "100vh         " + probeH("100vh"),
    "env top       " + probeH("env(safe-area-inset-top,0px)"),
    "env bottom    " + probeH("env(safe-area-inset-bottom,0px)"),
    "body altezza  " + Math.round(body.height) + "  top " + Math.round(body.top),
    "navbar fondo  " + Math.round(window.innerHeight - bar.bottom),
    "standalone    " + navigator.standalone + " / " + matchMedia("(display-mode: standalone)").matches,
    "dpr           " + window.devicePixelRatio
  ].join("\n");
}
function showDiag() {
  document.querySelector(".diag")?.remove();
  const el = document.createElement("div");
  el.className = "diag";
  el.innerHTML = "<b>Diagnostica schermo</b>" + esc(diagText()) +
    '<div><button type="button">Chiudi</button></div>';
  el.querySelector("button").addEventListener("click", () => el.remove());
  document.body.appendChild(el);
}
let diagTimer = null;
app.addEventListener("touchstart", e => {
  if (!e.target.closest("h1")) return;
  diagTimer = setTimeout(showDiag, 1000);
}, { passive: true });
["touchend", "touchmove", "touchcancel"].forEach(ev =>
  app.addEventListener(ev, () => clearTimeout(diagTimer), { passive: true }));
app.addEventListener("dblclick", e => { if (e.target.closest("h1")) showDiag(); });

fitShell();

/* La navbar si ritrae scorrendo verso il basso e torna piena scorrendo verso l'alto. */
let navLastY = 0, navAcc = 0, navMin = false, navTick = false;
function navSet(on) { if (on !== navMin) { navMin = on; root.classList.toggle("nav-min", on); } }
function navOnScroll() {
  if (navTick) return;
  navTick = true;
  requestAnimationFrame(() => {
    const y = app.scrollTop, d = y - navLastY;
    navLastY = y;
    // L'accumulatore evita che il momentum di iOS faccia scattare la barra avanti e indietro.
    navAcc = (d > 0) === (navAcc > 0) ? navAcc + d : d;
    if (y < 28) navSet(false);
    else if (navAcc > 14) navSet(true);
    else if (navAcc < -14) navSet(false);
    navTick = false;
  });
}
app.addEventListener("scroll", navOnScroll, { passive: true });
function navReset() { navLastY = 0; navAcc = 0; navMin = false; root.classList.remove("nav-min"); }

if (window.visualViewport) {
  visualViewport.addEventListener("resize", fitShell);
  visualViewport.addEventListener("scroll", fitShell);
}
window.addEventListener("orientationchange", () => setTimeout(fitShell, 250));
document.addEventListener("focusin", e => {
  if (e.target.matches("input, textarea")) setTimeout(() => e.target.scrollIntoView({ block: "center", behavior: "smooth" }), 320);
});

/* ---------- Start ---------- */
async function boot() {
  app.innerHTML = `<div class="loading"><span class="spin"></span>Carico la programmazione…</div>`;
  try {
    const { db, offline } = await loadDB();
    weeks = (db.weeks || []).filter(w => w && w.sessions && w.sessions.length); sortWeeks();
    if (!weeks.length) throw new Error("empty");
    const latest = weeks[0].number, seen = store.get("hpg-latest-seen", null), saved = store.get("hpg-current", null);
    if (seen !== null && latest > seen) { curNum = latest; setTimeout(() => toast(`Nuova programmazione: settimana ${latest}`), 400); }
    else curNum = weeks.some(w => w.number === saved) ? saved : latest;
    store.set("hpg-latest-seen", latest); store.set("hpg-current", curNum);
    buildTabs(); syncTop(); render({ fresh: true });
    if (offline) setTimeout(() => toast("Offline: mostro l'ultima versione salvata"), 400);
  } catch (e) {
    app.innerHTML = `<div class="loading err-box"><p>Non riesco a caricare la programmazione. Controlla la connessione e riprova.</p><button class="btn btn-ghost" id="retry">Riprova</button></div>`;
    document.getElementById("retry").addEventListener("click", boot);
  }
}
boot();
window.addEventListener("load", () => { fitShell(); if (TABS.length) syncTabs(current(), false); });
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && weeks.length) refreshSilently(); });
async function refreshSilently() {
  try { const { db, offline } = await loadDB(); if (offline) return;
    const nw = (db.weeks || []).filter(w => w && w.sessions && w.sessions.length);
    if (JSON.stringify(nw) === JSON.stringify(weeks)) return;
    const oldLatest = weeks[0].number; weeks = nw; sortWeeks();
    if (weeks[0].number > oldLatest) { curNum = weeks[0].number; store.set("hpg-current", curNum); store.set("hpg-latest-seen", curNum); toast(`Nuova programmazione: settimana ${curNum}`); }
    else if (!weeks.some(w => w.number === curNum)) curNum = weeks[0].number;
    buildTabs(); syncTop(); lastIdx = 0; if (location.hash && location.hash !== "#home") location.hash = "home"; else render({ fresh: true });
  } catch (e) {}
}
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
