<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hybrid ProGram">
<meta name="theme-color" content="#000000">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Hybrid ProGram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/app.css?v=20">
<script>
  // Prima del primo disegno: modalità app installata, così l'altezza è giusta da subito.
  if (navigator.standalone === true || matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches)
    document.documentElement.classList.add("pwa");
</script>
</head>
<body>
<div class="ambient" aria-hidden="true"><i class="a"></i><i class="b"></i><i class="c"></i></div>

<section class="auth" id="auth" hidden></section>

<header class="topbar">
  <button class="pill glass" id="weekBtn" aria-haspopup="dialog" hidden></button>
  <button class="round glass profile-btn" id="profileBtn" aria-haspopup="dialog" aria-label="Profilo" hidden></button>
</header>

<main id="app"></main>

<div class="tabwrap"><nav class="tabbar glass" aria-label="Sezioni"><div class="track" id="track"><div class="lens" id="lens"></div></div></nav></div>

<div class="backdrop" id="backdrop"></div>
<section class="sheet" id="sheetWeeks" role="dialog" aria-modal="true" aria-labelledby="swT" aria-hidden="true" inert>
  <div class="sheet-head"><h2 id="swT">Settimane</h2><button class="round" data-close aria-label="Chiudi"></button></div>
  <div class="sheet-body" id="weeksBody"></div>
</section>
<section class="sheet" id="sheetProfile" role="dialog" aria-modal="true" aria-labelledby="spT" aria-hidden="true" inert>
  <div class="sheet-head"><h2 id="spT">Profilo</h2><button class="round" data-close aria-label="Chiudi"></button></div>
  <div class="sheet-body" id="profileBody"></div>
</section>
<section class="sheet" id="sheetLog" role="dialog" aria-modal="true" aria-labelledby="slT" aria-hidden="true" inert>
  <div class="sheet-head"><h2 id="slT">Com'è andata?</h2><button class="round" data-close aria-label="Chiudi"></button></div>
  <div class="sheet-body" id="logBody"></div>
</section>
<div class="toast glass" id="toast" role="status" aria-live="polite"></div>

<script src="assets/config.js?v=20"></script>
<script type="module" src="assets/app.js?v=20"></script>
</body>
</html>
