name: Trova cartella sito (FTP)

# Avvio manuale: elenca dove si trova il sito sul server FTP (solo nomi di cartelle e file, nessun contenuto).
on:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    steps:
      - name: Installa lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp >/dev/null
      - name: Cerca index.html e data/program.json
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" "$FTP_SERVER" -e "
            set ssl:verify-certificate no; set net:max-retries 2; set net:timeout 20;
            echo '== cartella iniziale'; pwd; cls -1;
            echo '== percorsi con program.json';
            find -d 4 . | grep -E 'data/program\.json$|manifest\.webmanifest$' ;
            bye"
